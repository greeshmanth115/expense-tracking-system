{% extends "expenses/base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:20px auto">
<h3>Create Account</h3>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit" style="width:100%">Sign Up</button>
</form>
<p style="text-align:center">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
